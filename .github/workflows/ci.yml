name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Filename conventions
        run: bun run check:filenames

      - name: Unit tests (Vitest)
        run: bun run test

      - name: Build UI
        env:
          # Vite chunk rendering exceeds default ~2GB Node heap on ubuntu-latest.
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run build

      - name: Assert image optimizer stays lazy (plan §10.6)
        run: node scripts/media/assert-lazy-optimizer.mjs
