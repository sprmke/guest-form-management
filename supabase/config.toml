# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "guest-form-management"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
# Postgres 17 local stack needs a current Supabase CLI (≈2.80+) so `storage.*` exists
# before user migrations run. If `storage.buckets` / `storage.objects` errors appear on
# `db reset`, run: `npm run db:reset` or `npx supabase@latest db reset`.
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "../scripts/dev/seed-dashboard-demo-data.sql"]

# Admin sign-in (Google OAuth). Set GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET in
# ui/.env.development (same file as Vite dev vars). dev.sh / npm run start:supabase
# load that file into the environment before `supabase start`. Google Cloud → OAuth
# Web client → Authorized redirect URIs: http://127.0.0.1:54321/auth/v1/callback and
# http://localhost:54321/auth/v1/callback
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = [
  "http://127.0.0.1:5173/**",
  "http://localhost:5173/**",
]

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
# GoTrue needs this before redirecting to Google; without it, /auth/v1/authorize returns
# 400 validation_failed "Unsupported provider: missing redirect URI".
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"
skip_nonce_check = false

[auth.external.facebook]
enabled = true
client_id = "env(FACEBOOK_CLIENT_ID)"
secret = "env(FACEBOOK_CLIENT_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.payment-receipts]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg"]

[storage.buckets.pet-vaccinations]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg"]

# --- New-flow buckets (Phase 0, see docs/planning/NEW_FLOW_PLAN.md §2) ---

[storage.buckets.parking-endorsements]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "application/pdf"]

[storage.buckets.approved-gafs]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["application/pdf"]

[storage.buckets.approved-pet-forms]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["application/pdf"]

[storage.buckets.sd-refund-receipts]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "application/pdf"]

[storage.buckets.property-media]
public = true
file_size_limit = "25MiB"
allowed_mime_types = [
  "image/jpeg", "image/png", "image/webp", "image/gif",
  "image/heic", "image/heif", "image/bmp", "image/tiff", "image/avif", "image/svg+xml",
  "video/mp4", "video/webm", "video/quicktime", "video/x-msvideo",
  "video/x-matroska", "video/ogg", "video/mpeg",
  "audio/mpeg", "audio/mp3", "audio/wav", "audio/x-wav",
  "audio/ogg", "audio/mp4", "audio/x-m4a", "audio/aac", "audio/webm",
]

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# Email templates are read at runtime (`_shared/renderEmailHtml.ts#loadEmailTemplate`).
# The Edge bundler does not include arbitrary `.html` files unless listed here (CLI ≥ 2.7).
# Same for `_shared/email-assets/*.jpg` (inline CID images for `sendReadyForCheckin`).
# Repeat this block on every function that imports `emailService` or `workflowOrchestrator`.

# ── Public (guest-facing) functions — no JWT required ──────────────────────────
