<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contract notice</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f3f4f6;
      font-family:
        system-ui,
        -apple-system,
        Segoe UI,
        sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #f3f4f6; padding: 24px 12px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="max-width: 560px; background: #ffffff; border-radius: 16px; overflow: hidden"
          >
            <tr>
              <td style="height: 4px; background: #0f766e"></td>
            </tr>
            <tr>
              <td style="padding: 28px 24px 8px 24px">
                <p style="margin: 0 0 8px 0; font-size: 18px; font-weight: 600; color: #111827">
                  {{headline}}
                </p>
                <p style="margin: 0; font-size: 14px; color: #6b7280">
                  {{organization_name}} · {{leg_label}}
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 8px 24px 24px 24px">
                <p style="margin: 0 0 16px 0; font-size: 15px; line-height: 1.5; color: #374151">
                  Hi {{owner_name}},
                </p>
                <p style="margin: 0 0 16px 0; font-size: 15px; line-height: 1.5; color: #374151">
                  {{body}}
                </p>
                <p style="margin: 0 0 16px 0; font-size: 14px; line-height: 1.5; color: #6b7280">
                  Contract end date: <strong style="color: #111827">{{contract_end_date}}</strong>
                </p>
                <p style="margin: 0">
                  <a
                    href="{{dashboard_url}}"
                    style="
                      display: inline-block;
                      padding: 10px 16px;
                      background: #0f766e;
                      color: #ffffff;
                      text-decoration: none;
                      border-radius: 8px;
                      font-size: 14px;
                      font-weight: 600;
                    "
                    >Open dashboard</a
                  >
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
