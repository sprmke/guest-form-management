<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New message from your host</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f3f4f6;
      font-family:
        system-ui,
        -apple-system,
        Segoe UI,
        sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #f3f4f6; padding: 24px 12px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="max-width: 560px; background: #ffffff; border-radius: 16px; overflow: hidden"
          >
            <tr>
              <td style="height:4px;background:{{brand_color}};"></td>
            </tr>
            <tr>
              <td style="padding: 28px 24px 8px 24px">
                <p style="margin: 0 0 8px 0; font-size: 18px; font-weight: 600; color: #111827">
                  New message
                </p>
                <p style="margin: 0; font-size: 14px; color: #6b7280">{{property_name}}</p>
              </td>
            </tr>
            <tr>
              <td style="padding: 8px 24px 24px 24px">
                <p style="margin: 0 0 16px 0; font-size: 15px; line-height: 1.5; color: #374151">
                  Hi {{guest_name}},
                </p>
                <p style="margin: 0 0 16px 0; font-size: 15px; line-height: 1.5; color: #374151">
                  {{host_name}} replied about your stay inquiry:
                </p>
                <blockquote
                  style="margin:0 0 24px 0;padding:12px 16px;border-left:3px solid {{brand_color}};background:#f9fafb;border-radius:8px;font-size:14px;line-height:1.5;color:#111827;"
                >
                  {{message_preview}}
                </blockquote>
                <a
                  href="{{messages_url}}"
                  style="display:inline-block;background:{{brand_color}};color:{{brand_on_color}};text-decoration:none;font-size:14px;font-weight:600;padding:12px 20px;border-radius:10px;"
                  >View conversation</a
                >
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
